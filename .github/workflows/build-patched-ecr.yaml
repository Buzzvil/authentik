name: build-patched-ghcr

# Buzzvil fork: build the WorkSpaces-SAML-patched authentik image and push it to GHCR
# (ghcr.io/buzzvil/authentik). GitHub-hosted runner + GITHUB_TOKEN — no self-hosted
# runner, no AWS/ECR, no org secrets. Package is made public so the cluster pulls
# anonymously (no imagePullSecret).
on:
  push:
    branches:
      - buzzvil/workspaces-relaystate-2026.2.1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout (patch files only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .buzzvil
            authentik/providers/saml/processors/authn_request_parser.py
            authentik/providers/saml/views/sso.py
          sparse-checkout-cone-mode: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .buzzvil/Dockerfile
          push: true
          tags: |
            ghcr.io/buzzvil/authentik:2026.2.1-relaystate-${{ github.sha }}
            ghcr.io/buzzvil/authentik:2026.2.1-relaystate
