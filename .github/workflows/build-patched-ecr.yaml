name: build-patched-ghcr

# authentik 패치 이미지 빌드 + GitHub Release 를 함께 생성.
# 오버레이 패치 목록·경로는 .buzzvil/Dockerfile 참고 (SAML RelayState + OAuth2 CORS regex).
#
# 트리거: '<authentik version>-cors-relaystate' 형태의 태그 push
#         (예: 2026.8.5-cors-relaystate).
#         release 태그는 유지하고, P1 이미지는 source SHA/run/attempt를 붙인 새 태그를 쓴다.
#         (git 태그명이 'relaystate' 인 것은 최초 SAML 패치 시절의 관례일 뿐, 이미지에는
#          Dockerfile 이 COPY 하는 모든 포크 패치가 포함된다.)
#
# 새 authentik 버전 릴리스 절차:
#   1) 새 브랜치(buzzvil/*-<ver>)에서 .buzzvil/Dockerfile 의 FROM 을 그 버전으로 바꾸고
#      포크 패치와 .buzzvil/payload.json, sparse-checkout 목록도 맞춘다.
#   2) 그 커밋에 태그 '<ver>-cors-relaystate' 를 push
#      → 이 워크플로우가 이미지 빌드 + release 생성.
#   3) ops(buzz-k8s-resources) 의 global.image tag 를 갱신하고 로그인/CORS 재검증.
on:
  push:
    branches:
      - 'VULN-688/**'
    tags:
      - '*-relaystate'
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Base tag: 2026.8.5-cors-relaystate. P1 appends source SHA/run/attempt; existing tags are not overwritten."
        required: true

permissions:
  contents: write   # release 생성
  packages: write   # GHCR push

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Verify payload source
        run: python3 .buzzvil/verify-payload.py source

  build:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: patched-image-publication-${{ github.ref }}
      cancel-in-progress: false
    env:
      BASE_IMAGE_TAG: ${{ github.event.inputs.image_tag || github.ref_name }}
      IMAGE_TAG: ${{ format('{0}-p1-{1}-{2}-{3}', github.event.inputs.image_tag || github.ref_name, github.sha, github.run_id, github.run_attempt) }}
    steps:
      - name: Require the matching upstream version
        run: |
          test "$BASE_IMAGE_TAG" = 2026.8.5-cors-relaystate

      - name: Checkout (patch files only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          sparse-checkout: |
            .buzzvil
            .github/workflows/build-patched-ecr.yaml
            authentik/providers/saml/processors/authn_request_parser.py
            authentik/providers/saml/views/sso.py
            authentik/providers/oauth2/utils.py
            authentik/providers/oauth2/views/token.py
            authentik/providers/oauth2/views/userinfo.py
            authentik/providers/oauth2/views/provider.py
            authentik/stages/user_write
            blueprints/schema.json
            schema.yml
            packages/client-ts/src/apis/StagesApi.ts
            packages/client-ts/src/models/PatchedUserWriteStageRequest.ts
            packages/client-ts/src/models/UserWriteStage.ts
            packages/client-ts/src/models/UserWriteStageRequest.ts
          sparse-checkout-cone-mode: false

      - name: Verify publishing payload source
        run: python3 .buzzvil/verify-payload.py source

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: .buzzvil/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            IMAGE_VERSION=${{ env.IMAGE_TAG }}
          tags: ghcr.io/buzzvil/authentik:${{ env.IMAGE_TAG }}

      - name: Create or update GitHub Release image history
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+-cors-relaystate$ ]]; then
            echo "unexpected release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          notes_file="$RUNNER_TEMP/patched-release-notes.md"
          history_entry="$RUNNER_TEMP/patched-release-entry.md"
          printf '\n\n### P1 image run %s attempt %s\n\nImage: `%s`\n\nIndex: `%s`\n\nSource: `%s`\n\nRun: %s/%s/actions/runs/%s/attempts/%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "ghcr.io/buzzvil/authentik:$IMAGE_TAG" \
            "$IMAGE_DIGEST" "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$history_entry"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$notes_file"; then
            cat "$history_entry" >> "$notes_file"
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$notes_file"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG — Buzzvil patched authentik (RelayState, CORS, conditional UserWrite)" \
              --notes-file "$history_entry" \
              --verify-tag
          fi
